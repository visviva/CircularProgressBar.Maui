name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to publish (for example, 1.2.3 or 1.2.3-preview.1)
        required: true
        type: string
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read
  id-token: write

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  DOTNET_NOLOGO: "true"
  HUSKY: "0"
  PROJECT: CircularProgressBar.Maui/CircularProgressBar.Maui.csproj

jobs:
  pack-and-push:
    name: Pack and publish to NuGet
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Install MAUI workload
        run: dotnet workload install maui-android

      - name: Resolve package version
        id: version
        env:
          REQUESTED_VERSION: ${{ inputs.version || github.ref_name }}
        run: |
          VERSION="${REQUESTED_VERSION#v}"
          if [ -z "$VERSION" ]; then
            echo "A package version is required." >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Restore
        run: dotnet restore "$PROJECT"

      - name: Pack
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: >-
          dotnet pack "$PROJECT"
          --configuration Release
          --no-restore
          --output artifacts/packages
          -p:Version="$VERSION"

      - name: Upload packages
        uses: actions/upload-artifact@v7
        with:
          name: nuget-${{ steps.version.outputs.version }}
          path: |
            artifacts/packages/*.nupkg
            artifacts/packages/*.snupkg
          if-no-files-found: error

      - name: NuGet login
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: visviva

      - name: Publish to NuGet.org
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
          VERSION: ${{ steps.version.outputs.version }}
        run: >-
          dotnet nuget push
          "artifacts/packages/CircularProgressBar.Maui.$VERSION.nupkg"
          --api-key "$NUGET_API_KEY"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate
